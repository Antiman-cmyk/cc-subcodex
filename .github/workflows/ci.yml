name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      DISABLE_AUTOUPDATER: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: ./.github/actions/install
      - run: claude plugin validate --strict .
      - run: claude plugin test .
      - id: e2e
        run: |
          python tests/e2e/run.py && exit 0
          python -c "import glob, os, tempfile; print('kept=' + max(glob.glob(os.path.join(tempfile.gettempdir(), 'subcodex-tests-*')), key=os.path.getmtime))" >> "$GITHUB_OUTPUT"
          exit 1
      - if: failure() && steps.e2e.outputs.kept
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ runner.os }}
          path: ${{ steps.e2e.outputs.kept }}
          include-hidden-files: true
