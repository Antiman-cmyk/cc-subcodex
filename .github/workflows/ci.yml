name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      DISABLE_AUTOUPDATER: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: ./.github/actions/install
      - run: claude plugin validate --strict .
      - run: claude plugin test .
      - name: Codex's own Windows sandbox for the cases (no MXC here)
        if: runner.os == 'Windows'
        run: |
          home="$(cygpath -u "$RUNNER_TEMP")/codex-sandbox" && mkdir -p "$home"
          CODEX_HOME="$(cygpath -w "$home")" codex sandbox setup --elevated --current-user
          echo "SUBCODEX_TESTS_CODEX_SANDBOX=$(cygpath -w "$home")" >> "$GITHUB_ENV"
      - id: e2e
        run: python tests/e2e/run.py --out "$RUNNER_TEMP/e2e"
      - if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ runner.os }}
          path: |
            ${{ runner.temp }}/e2e
            !${{ runner.temp }}/e2e/**/.sandbox-bin/**
          include-hidden-files: true
